<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #E6EBF0;
  --panel: #F6F8FA;
  --panel-2: #FFFFFF;
  --ink: #1A2735;
  --muted: #566677;
  --line: #C6D0DA;
  --field: #FFFFFF;
  --accent: #2F5DA8;
  --dup: #1D7C86;
  --ok: #2B7A5F;
  --edit: #A4651A;
  --del: #A63846;
  --unrev: #8795A4;
  --leak: #7446B0;
  --mark: #FCE38A;
  --mark-cur: #F2B233;
  --sans: "PT Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --serif: "PT Serif", Georgia, "Times New Roman", serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121A22; --panel: #1A242E; --panel-2: #212D39; --ink: #E3E9EF; --muted: #9AA9B8;
    --line: #34424F; --field: #151E27; --accent: #7BA3E6; --dup: #5CC3CC; --ok: #5DBB95; --edit: #E0A155;
    --del: #E07A86; --unrev: #7C8A98; --leak: #B99BEB; --mark: #6B5A1C; --mark-cur: #A9771A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121A22; --panel: #1A242E; --panel-2: #212D39; --ink: #E3E9EF; --muted: #9AA9B8;
  --line: #34424F; --field: #151E27; --accent: #7BA3E6; --dup: #5CC3CC; --ok: #5DBB95; --edit: #E0A155;
  --del: #E07A86; --unrev: #7C8A98; --leak: #B99BEB; --mark: #6B5A1C; --mark-cur: #A9771A; color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  height: 100%; margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 var(--sans); display: grid; grid-template-rows: auto minmax(0, 1fr);
}
button, input { font: inherit; color: inherit; }
button {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 5px;
  padding: 3px 10px; cursor: pointer; white-space: nowrap;
}
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] button.primary { color: #0E1620; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { color: #0E1620; } }
button.quiet { border-color: transparent; background: transparent; color: var(--muted); }
button.quiet:hover { color: var(--ink); border-color: var(--line); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="text"], input:not([type]) {
  background: var(--field); border: 1px solid var(--line); border-radius: 4px;
  padding: 4px 7px; width: 100%; min-width: 0;
}
input:disabled, select:disabled { opacity: .6; }
.fld > select {
  font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 4px;
  padding: 4px 7px; width: 100%; min-width: 0;
}

/* header */
.top {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
}
.top h1 { font-size: 17px; margin: 0 auto 0 0; font-weight: 700; }
.top label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.top label input { width: 150px; color: var(--ink); }

main { display: grid; grid-template-columns: 240px minmax(0, 1fr) minmax(0, 1.3fr); min-height: 0; }
.pane { overflow: auto; min-height: 0; }
.pane + .pane { border-left: 1px solid var(--line); }
.pane-head {
  position: sticky; top: 0; z-index: 2; background: var(--bg);
  padding: 10px 14px; border-bottom: 1px solid var(--line);
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
}
.pane-head h2 { font-size: 14px; margin: 0; color: var(--muted); font-weight: 700; }

/* file list */
.files ul { list-style: none; margin: 0; padding: 6px; }
.file-btn {
  display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none;
  padding: 7px 8px; border-radius: 5px; white-space: normal;
}
.file-btn[aria-current="true"] { background: var(--panel-2); border-color: var(--line); }
.file-name { display: block; font-size: 13.5px; overflow-wrap: anywhere; }
.file-meta { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
.file-meta.warn { color: var(--del); }
.bar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; margin-top: 5px; background: var(--line); }
.bar span { display: block; height: 100%; }
.c-correct { background: var(--ok); } .c-edited { background: var(--edit); }
.c-deleted { background: var(--del); } .c-added { background: var(--accent); } .c-duplicate { background: var(--dup); }
.c-unreviewed { background: transparent; }

/* source */
.source-body { padding: 18px 22px 40px; }
.source-text {
  font: 16px/1.65 var(--serif); white-space: pre-wrap; overflow-wrap: anywhere;
  max-width: 72ch; margin: 0;
}
.source-text mark { background: var(--mark); color: inherit; border-radius: 2px; }
.source-text mark.cur { background: var(--mark-cur); }
.search { display: flex; gap: 6px; align-items: center; flex: 1 1 260px; }
.search input { flex: 1; }
.search .count { color: var(--muted); font-size: 12.5px; min-width: 52px; text-align: right; }
.note { color: var(--muted); font-size: 12.5px; width: 100%; }
.empty { color: var(--muted); padding: 24px; max-width: 46ch; }

/* tree */
.tree-body { padding: 8px 14px 60px; }
.tally { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12.5px; }
.tally span { padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); }
.tally .t-unreviewed { border-style: dashed; }
.tally i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.head-actions { margin-left: auto; display: flex; gap: 6px; }

.node {
  --rail: var(--unrev);
  border-left: 4px dashed var(--rail); background: var(--panel);
  border-radius: 0 6px 6px 0; margin: 10px 0; border-top: 1px solid var(--line);
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
.node .node { background: var(--panel-2); margin: 8px 0; }
.node .node .node { background: var(--panel); }
.node.st-correct { --rail: var(--ok); border-left-style: solid; }
.node.st-edited { --rail: var(--edit); border-left-style: solid; }
.node.st-deleted { --rail: var(--del); border-left-style: solid; }
.node.st-added { --rail: var(--accent); border-left-style: solid; }
.node.st-duplicate { --rail: var(--dup); border-left-style: solid; }
.problem { flex-basis: 100%; font-size: 12.5px; color: var(--del); padding-left: 30px; }
.problem:empty { display: none; }
.moved-note { flex-basis: 100%; font-size: 12.5px; color: var(--edit); padding-left: 30px; }
.moved-note:empty { display: none; }
.move-row { flex-basis: 100%; min-width: 0; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 4px 0 2px 30px; }
.move-row select { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; min-width: 0; width: 100%; flex: 1 1 100%; }
.empty-doc { border: 1px dashed var(--line); border-radius: 6px; padding: 12px 14px; margin: 10px 0; color: var(--muted); }
.empty-doc p { margin: 0 0 8px; }
.empty-doc.done { border-style: solid; border-color: var(--ok); }
.node.flash { animation: flash 1.2s ease-out 1; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 3px transparent; } }
@media (prefers-reduced-motion: reduce) { .node.flash { animation: none; outline: 2px solid var(--accent); } }

.node-head { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 4px; flex-wrap: wrap; }
.twisty { border: none; background: none; padding: 2px 6px; color: var(--muted); }
.twisty::before { content: "▸"; display: inline-block; transition: transform .12s; }
.twisty[aria-expanded="true"]::before { transform: rotate(90deg); }
.kind { font-size: 12px; color: var(--muted); }
.node-title { font-weight: 700; overflow-wrap: anywhere; flex: 1 1 160px; }
.person > .node-head .node-title { font-size: 16px; }
.st-deleted > .node-head .node-title { text-decoration: line-through; color: var(--muted); }
.badge { font-size: 12px; padding: 0 8px; border-radius: 10px; color: var(--rail); border: 1px solid var(--rail); }
.st-unreviewed > .node-head .badge { border-style: dashed; }
.actions { display: flex; gap: 5px; flex-wrap: wrap; }
.act-ok { color: var(--ok); } .act-del { color: var(--del); }

.node-body { padding: 2px 12px 10px 16px; }
.grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px 10px; }
.fld { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fld-label { font-size: 12px; color: var(--muted); }
.fld.changed input, .fld.changed select { border-color: var(--edit); }
.was { font-size: 12px; color: var(--edit); overflow-wrap: anywhere; }
.was:empty { display: none; }
.fld-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 20px; }
.leak-btn { font-size: 11.5px; line-height: 1.4; padding: 0 7px; border-radius: 10px; color: var(--muted); background: transparent; }
.leak-btn[aria-pressed="true"] { background: var(--leak); border-color: var(--leak); color: #fff; }
:root[data-theme="dark"] .leak-btn[aria-pressed="true"] { color: #1A1030; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .leak-btn[aria-pressed="true"] { color: #1A1030; } }
.leak-btn:disabled { opacity: .35; cursor: default; }
.fld.leak > input, .fld.leak > select, .fld.leak .span-row input, .fld.leak .chips { border-color: var(--leak); box-shadow: inset 3px 0 0 var(--leak); }
.leak-count { font-size: 12px; color: var(--leak); }
.leak-count:empty { display: none; }
.tally .t-leak { border-color: var(--leak); color: var(--leak); }
.chips {
  display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
  border: 1px solid var(--line); border-radius: 4px; padding: 3px; background: var(--field); min-height: 32px;
}
.fld.changed .chips { border-color: var(--edit); }
.chip { display: inline-flex; align-items: center; gap: 2px; padding: 0 2px 0 7px; border-radius: 3px; background: var(--bg); font-size: 13px; }
.chip button { border: none; background: none; padding: 0 4px; color: var(--muted); }
.chips input { border: none; width: 70px; flex: 1; padding: 2px 4px; background: transparent; }
.span-row { display: flex; gap: 4px; margin-bottom: 4px; }
.span-row input.bad { border-color: var(--del); background: color-mix(in srgb, var(--del) 8%, var(--field)); }
.add-row { margin-top: 10px; display: flex; gap: 8px; }
.children { margin-top: 6px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg);
  padding: 8px 16px; border-radius: 6px; max-width: min(560px, 92vw); opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
.toast.show { opacity: 1; }
.drop-hint { position: fixed; inset: 0; background: color-mix(in srgb, var(--accent) 18%, transparent);
  border: 3px dashed var(--accent); display: none; align-items: center; justify-content: center; font-size: 20px; z-index: 10; }
body.dragging .drop-hint { display: flex; }

@media (max-width: 900px) {
  html, body { height: auto; }
  body { display: block; }
  main { grid-template-columns: minmax(0, 1fr); }
  .pane + .pane { border-left: none; border-top: 1px solid var(--line); }
  .files { max-height: 30vh; }
  .source { max-height: 60vh; }
  .tree { overflow: visible; }
  .grid > .fld { grid-column: span 6 !important; }
}
</style>
</head>
<body>
<header class="top">
  <h1>Event review</h1>
  <label>Reviewer <input id="reviewer" type="text" autocomplete="name" placeholder="Your name"></label>
  <button id="loadBtn">Load files</button>
  <input id="fileInput" type="file" multiple accept=".json,.txt,.zip" hidden>
  <button id="saveAllBtn" title="Download every finished review as one .zip file">Download finished</button>
</header>
<main>
  <nav class="pane files" aria-label="Files">
    <div class="pane-head"><h2>Files</h2></div>
    <ul id="fileList"></ul>
  </nav>
  <section class="pane source" aria-label="Source text">
    <div class="pane-head">
      <div class="search">
        <input id="search" type="text" placeholder="Search the source text" aria-label="Search the source text">
        <span class="count" id="searchCount"></span>
        <button id="prevHit" aria-label="Previous match">↑</button>
        <button id="nextHit" aria-label="Next match">↓</button>
      </div>
      <div class="note" id="searchNote"></div>
    </div>
    <div class="source-body" id="sourceBody"></div>
  </section>
  <section class="pane tree" aria-label="Extracted people and events">
    <div class="pane-head" id="treeHead"></div>
    <div class="tree-body" id="treeBody"></div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="drop-hint">Drop files here to load them</div>

<script>
(() => {
"use strict";

const PF = ["name", "family_name", "given_name", "middle_name"];
const EF = ["event_type", "dates", "town_city", "region", "country"];
const LABEL = {
  name: "Full name", family_name: "Family name", given_name: "Given name", middle_name: "Middle name",
  event_type: "Event type", dates: "Dates", town_city: "City", region: "Region", country: "Country"
};
const EVENT_TYPES = [
  "death", "death_sudden_illness", "death_long_term_illness", "death_in_combat", "vehicle_crash",
  "retirement", "dismissal", "left_russia", "prosecution", "threat_of_prosecution",
  "violent_attack", "threat_of_violence", "imprisonment", "house_arrest"
];
// A date is a single point (YYYY, YYYY-MM or YYYY-MM-DD), or a period start:end for continuous
// events such as imprisonment (e.g. 1996-12:2004-01). The end can be "present" for an ongoing period.
const POINT = "\\d{4}(?:-\\d{2}(?:-\\d{2})?)?";
const DATE_RE = new RegExp(`^${POINT}(?::(?:${POINT}|present))?$`, "i");
const DATE_HELP = "YYYY-MM for a single date, or start:end for a period (e.g. 1996-12:2004-01, or 2022-03:present). YYYY and YYYY-MM-DD also work; use 00 for an unknown month or day.";
// Known part of a date, for comparing start and end: "1996-00" -> "1996"; null if the year is unknown.
const knownPart = d => d.startsWith("0000") ? null : d.replace(/(-00)+$/, "");
function dateProblem(s) {
  const t = String(s ?? "").trim();
  if (t === "") return null;   // events may have no dates (the text often doesn't give one), so a blank box is ignored
  if (!DATE_RE.test(t)) return "Fix the dates: use YYYY-MM for a date, or YYYY-MM:YYYY-MM for a period.";
  const [a, b] = t.split(":").map(x => x.toLowerCase() === "present" ? null : knownPart(x));
  if (a && b) { const n = Math.min(a.length, b.length); if (a.slice(0, n) > b.slice(0, n)) return `Fix the dates: ${t} ends before it starts.`; }
  return null;
}
const badDate = s => !!dateProblem(s);
const STATUS_TEXT = { unreviewed: "To review", correct: "Correct", edited: "Edited", deleted: "Deleted", added: "Added", duplicate: "Duplicate" };
const STORE = "ev1:";
const FORMAT = "event-review/1", SUMMARY_FORMAT = "event-review-summary/1";

const S = {
  files: new Map(),       // base -> {base, hash, json, text, review, error}
  pendingText: new Map(), // base -> text, for .txt loaded before its .json
  current: null,
  open: new Map(),        // node id -> expanded override
  search: { terms: [], idx: 0, count: 0 },
  saveTimer: null,
  dl: (window.claude && typeof window.claude.use === "function") ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null)
};

const $ = id => document.getElementById(id);
const clone = v => v == null ? v : JSON.parse(JSON.stringify(v));
const nowIso = () => new Date().toISOString();

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

function hash(s) { let x = 5381; for (let i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0; return (x >>> 0).toString(36); }

function toast(msg, ms = 4200) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), ms);
}

/* ---------- storage (per-viewer convenience) ---------- */
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } }

/* ---------- model ---------- */
function norm(f, v) {
  if (f === "dates") { const a = (v == null ? [] : Array.isArray(v) ? v : [v]).map(s => String(s ?? "").trim().replace(/:present$/i, ":present")).filter(Boolean); return a.length ? a : null; }
  if (v == null) return null;
  const t = String(v).trim(); return t === "" ? null : t;
}
const UNKNOWN = "<unknown>";
const LIST_FIELDS = new Set(["dates"]);
const EMPTY_DATE_RE = /^0000(-00){0,2}(:0000(-00){0,2})?$/; // fully unknown date or period: treated as no date
const cleanList = (f, v) => (norm(f, v) || []).filter(s => s !== "" && !EMPTY_DATE_RE.test(s));
function cmpVal(f, v) {
  const x = norm(f, v);
  if (LIST_FIELDS.has(f)) { const c = cleanList(f, v); return c.length ? Array.from(new Set(c)).sort() : null; }
  return x === UNKNOWN ? null : x;
}
const eq = (f, a, b) => JSON.stringify(cmpVal(f, a)) === JSON.stringify(cmpVal(f, b));
const fieldsOf = n => n.kind === "person" ? PF : EF;
// Which person an event belongs to now (parentId) vs. the person the model gave it to (origParent).
function ensureParents(review) {
  const walk = (n, parentId) => {
    n.parentId = parentId;
    if (n.kind === "event" && !n.added && !n.dup && n.origParent === undefined) n.origParent = parentId;
    n.children.forEach(c => walk(c, n.id));
  };
  review.people.forEach(p => walk(p, null));
}
const moved = n => n.kind === "event" && !n.added && !n.dup && n.origParent != null && n.parentId !== n.origParent;
const changed = n => !n.added && (moved(n) || fieldsOf(n).some(f => !eq(f, n.orig[f], n.cur[f])));
// Data leakage: a value that is correct but not supported by the source text.
// It describes the model's value, so it can be marked on any field where the model gave a value,
// and it stays marked if the reviewer corrects or clears the value, or deletes the whole item.
const canLeak = (n, f) => !n.added && !n.dup && !!n.orig && !isEmptyField(f, n.orig[f]);
const isLeak = (n, f) => !!(n.leak && n.leak[f]) && canLeak(n, f);
const leakCount = n => fieldsOf(n).filter(f => isLeak(n, f)).length;
// The model's confidence keys (region__prob, region__null_prob, dates__prob, ...). They are not shown,
// so they can't sway the reviewer, but they are kept on each node and passed through to the review log.
const PROB_KEY = /__\w*prob$/;
function probsOf(obj) {
  if (!obj || typeof obj !== "object") return null;
  const o = {}; for (const [k, v] of Object.entries(obj)) if (PROB_KEY.test(k)) o[k] = clone(v);
  return Object.keys(o).length ? o : null;
}
// Re-reads the probabilities from the record file, for reviews restored from an autosave made before they were kept.
function attachProbs(review, json) {
  const at = path => { const m = /^people\[(\d+)\](?:\.events\[(\d+)\])?$/.exec(path || ""); if (!m) return null;
    const p = json?.people?.[+m[1]]; return m[2] == null ? p : p?.events?.[+m[2]]; };
  const walk = n => { if (!n.added && !n.dup && n.path) n.probs = probsOf(at(n.path)); n.children.forEach(walk); };
  review.people.forEach(walk);
}

function status(n) {
  if (n.dup) return "duplicate";
  if (n.added) return "added";
  if (n.decision === "delete") return "deleted";
  if (n.decision === "accept") return changed(n) ? "edited" : "correct";
  return "unreviewed";
}

function buildEvent(e, id, path) {
  const orig = {}; EF.forEach(f => orig[f] = clone(e[f] ?? null));
  if (orig.dates != null && !Array.isArray(orig.dates)) orig.dates = [orig.dates];
  return { id, kind: "event", path, orig, cur: clone(orig), probs: probsOf(e), decision: null, auto: false, added: false, t: null, children: [] };
}
function buildReview(json) {
  return {
    nextNew: 1, savedAt: null, dirtySinceSave: false,
    people: (json.people || []).map((p, i) => {
      const orig = {}; PF.forEach(f => orig[f] = p[f] ?? null);
      return {
        id: "p" + i, kind: "person", path: "people[" + i + "]", orig, cur: clone(orig), probs: probsOf(p),
        decision: null, auto: false, added: false, t: null,

async function readZip(buf) {

  let p = dv.getUint32(eocd + 16, true);
  for (let k = 0; k < count; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("unreadable zip directory");
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
    const path = dec.decode(u8.subarray(p + 46, p + 46 + nlen));

    if (!name || path.startsWith("__MACOSX") || name.startsWith("._")) continue;
    const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);

    if (method === 0) data = raw;

    const st = n.dup ? "duplicate" : via ? "deleted" : status(n);
    const kind = n.kind;
    const mode = n.dup ? (via ? "duplicate_deleted" : "duplicate") : st === "deleted" ? "deleted" : st === "added" ? "added" : "kept";
    const e = { node_id: n.id, kind, parent_id: parentId, original_path: (n.added || n.dup) ? null : n.path, status: st };
    if (n.kind === "event" && !n.added && !n.dup) {
      e.original_parent_id = n.origParent ?? parentId;
      const toAdded = !!findNode(f.review, parentId)?.node.added;
      if (moved(n)) { e.moved = true; e.moved_to_added_person = toAdded; }
      if (st === "correct" || st === "edited") {
        structure.kept_events++;
        if (moved(n)) { structure.moved++; structure[toAdded ? "moved_to_added_person" : "moved_to_model_person"]++; }
      }
    }
    if (n.probs && !n.added && !n.dup) e.model_probs = clone(n.probs);
    if (n.dup) { e.duplicate_of = n.dup; e.duplicate_of_path = findNode(f.review, n.dup)?.node.path ?? null; }
    if (via) e.deleted_with_parent = true;
    if (n.t && !via) e.decided_at = n.t;
    e.fields = {};
    fieldsOf(n).forEach(k => {
      const r = scoreField(k, n.orig ? n.orig[k] : null, n.cur[k], mode);
      r.leakage = (mode === "kept" || mode === "deleted") && isLeak(n, k);
      if (mode === "kept" || mode === "deleted") Object.assign(r, fieldProbs(n, k));
      e.fields[k] = r; addToCounts(counts, k, r);
    });
    log.push(e);
    (byKind[kind] ||= { correct: 0, edited: 0, deleted: 0, added: 0, duplicate: 0 })[st]++;
    n.children.forEach(c => visit(c, n.id, depth + 1, via || st === "deleted"));
  };
  f.review.people.forEach(p => visit(p, null, 0, false));
  const corrected = { people: f.review.people.filter(p => status(p) !== "deleted").map(p => {
    const g = k => norm(k, p.cur[k]);
    return { name: g("name"), family_name: g("family_name"), given_name: g("given_name"), middle_name: g("middle_name"),
      events: p.children.filter(c => status(c) !== "deleted").map(outEvent) };
  }) };
  const ts = nowIso();
  return { format: FORMAT, source_file: f.base + ".json", source_text: f.base + ".txt",
    blank_record: !!f.blank, confirmed_empty: !f.review.people.length && !!f.review.confirmedEmpty, reviewer, exported_at: ts,
    review_history: (f.review.history || []).concat([{ reviewer, exported_at: ts }]),
    summary: { by_kind: byKind, structure, field_scores: fieldScores(counts) }, corrected, log };
}

function csvCell(v) {
  if (v == null) return "";
  const s = Array.isArray(v) ? v.join("; ") : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function outcomesCsv(exports) {
  const head = ["file", "node_id", "kind", "event_type", "node_status", "original_path", "duplicate_of", "moved", "field", "model", "corrected", "outcome", "leakage", "item_tp", "item_fp", "item_fn", "prob", "null_prob"];
  const rows = [head.join(",")];
  for (const x of exports) for (const e of x.log) {
    const et = e.kind === "event" ? eventTypeOf(e) : null;
    for (const [f, r] of Object.entries(e.fields)) {
      rows.push([x.source_file, e.node_id, e.kind, et, e.status, e.original_path, e.duplicate_of, e.moved ? "true" : "", f, r.model, r.corrected, r.outcome, r.leakage ? "true" : "false",
        r.items?.tp, r.items?.fp, r.items?.fn, r.prob, r.null_prob].map(csvCell).join(","));
    }
  }
  return "\uFEFF" + rows.join("\r\n") + "\r\n";
}
// The type an event is grouped under: the reviewer's type, or the model's for deleted events.
const eventTypeOf = e => { const t = e.fields?.event_type; return (e.status === "deleted" ? t?.model : t?.corrected) ?? t?.model ?? "(no type)"; };
function batchSummary(exports, reviewer) {
  const counts = {}, byKind = {}, structure = {};
  exports.forEach(x => {
    for (const [k, v] of Object.entries(x.summary.structure || {})) structure[k] = (structure[k] || 0) + v;
    const raw = {};
    for (const [f, v] of Object.entries(x.summary.field_scores)) raw[f] = { outcomes: v.outcomes, leakage: v.leakage, leakage_by_outcome: v.leakage_by_outcome, items_kept_nodes: v.items_kept_nodes, items_added_or_deleted_nodes: v.items_added_or_deleted_nodes };
    mergeCounts(counts, raw); mergeByKind(byKind, x.summary.by_kind);
  });
  return { format: SUMMARY_FORMAT, reviewer, exported_at: nowIso(), files: exports.map(x => x.source_file),
    by_kind: byKind, structure, field_scores: fieldScores(counts) };
}

function gate(f) {
  const c = tally(f.review);
  if (c.emptyPending) return "This file has no people yet. Add them, or confirm there is nothing to add.";
  if (c.unreviewed) return `${c.unreviewed} item${c.unreviewed > 1 ? "s" : ""} in this file still need${c.unreviewed > 1 ? "" : "s"} a decision.`;
  if (c.invalid) return `${c.invalid} item${c.invalid > 1 ? "s have" : " has"} a problem to fix, shown in red on the item.`;
  return null;
}
function reviewerName() {
  const r = $("reviewer").value.trim();
  if (!r) { toast("Enter your name in the Reviewer box first."); $("reviewer").focus(); }
  return r;
}

const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(bytes) { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
// Minimal uncompressed .zip writer (UTF-8 file names), so no external library is needed.
function makeZip(entries) {
  const enc = new TextEncoder(), parts = [], central = [], d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let offset = 0;
  for (const e of entries) {
    const name = enc.encode(e.name), data = enc.encode(e.text), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const size = central.reduce((a, c) => a + c.length, 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, size, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: "application/zip" });
}

async function saveData(filename, data, mime) {
  const dl = await S.dl;
  if (dl) {
    try { await dl.save({ filename, data }); return true; }
    catch (e) {
      if (e && e.code === "declined") { toast("Download cancelled."); return false; }
      if (e && e.code === "rate_limited") { toast("A download prompt is already open. Finish that one first."); return false; }
      if (e && !["unavailable", "not_granted", "capability_disabled", "capability_removed"].includes(e.code)) { toast("Couldn't download: " + (e.message || e.code)); return false; }
    }
  }
  // Ordinary browser download (used when the page is self-hosted).
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const url = URL.createObjectURL(blob), a = h("a", { href: url, download: filename });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return true;
}
const reviewFileName = f => f.base + ".review.json";
function markDownloaded(f) { f.review.savedAt = nowIso(); f.review.dirtySinceSave = false; persist(f); }

async function saveOne(f) {
  const problem = gate(f);
  if (problem) { toast(problem + " “Next to review” takes you there."); return; }
  const reviewer = reviewerName(); if (!reviewer) return;
  const ok = await saveData(reviewFileName(f), JSON.stringify(buildExport(f, reviewer), null, 2), "application/json");
  if (ok) { markDownloaded(f); renderFileItem(f); toast("Downloaded " + reviewFileName(f)); }
}
async function saveAll() {
  const all = sortedBases().map(b => S.files.get(b)).filter(f => f.review);
  const ready = all.filter(f => !gate(f));
  if (!ready.length) { toast("No file is finished yet. A file is finished when every item has a decision."); return; }
  const reviewer = reviewerName(); if (!reviewer) return;
  const exports = ready.map(f => buildExport(f, reviewer));
  const zip = makeZip([
    { name: "summary.json", text: JSON.stringify(batchSummary(exports, reviewer), null, 2) },
    { name: "field_outcomes.csv", text: outcomesCsv(exports) },
    ...exports.map((x, i) => ({ name: reviewFileName(ready[i]), text: JSON.stringify(x, null, 2) }))
  ]);
  const ok = await saveData(`reviews-${new Date().toISOString().slice(0, 10)}.zip`, zip, "application/zip");
  if (ok) {
    ready.forEach(markDownloaded);
    renderFileList();
    const left = all.length - ready.length;
    toast(`Downloaded ${ready.length} finished review${ready.length > 1 ? "s" : ""} in one .zip file.` + (left ? ` ${left} not finished yet.` : ""));
  }
}

/* ---------- wiring ---------- */
function renderAll() { renderFileList(); renderSource(false); renderTree(); if (!cur()) $("treeBody").replaceChildren(emptyState()); }

$("loadBtn").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", e => { loadFiles(e.target.files); e.target.value = ""; });
$("saveAllBtn").addEventListener("click", saveAll);
$("reviewer").value = lsGet(STORE + "reviewer") || lsGet("xr1:reviewer") || "";   // xr1: the organizations page
$("reviewer").addEventListener("input", e => lsSet(STORE + "reviewer", e.target.value));
$("search").addEventListener("input", e => { const v = e.target.value.trim(); S.search.terms = v ? [v] : []; S.search.idx = 0; $("searchNote").textContent = ""; renderSource(true); });
$("search").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); stepHit(e.shiftKey ? -1 : 1); } });
$("prevHit").addEventListener("click", () => stepHit(-1));
$("nextHit").addEventListener("click", () => stepHit(1));

let dragDepth = 0;
window.addEventListener("dragenter", e => { if (e.dataTransfer?.types?.includes("Files")) { dragDepth++; document.body.classList.add("dragging"); } });
window.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove("dragging"); });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging"); if (e.dataTransfer?.files?.length) loadFiles(e.dataTransfer.files); });

renderAll();
})();
